name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: peblotv_test
          POSTGRES_USER: peblo
          POSTGRES_PASSWORD: peblo_secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://peblo:peblo_secret_password@localhost:5432/peblotv_test
          STORAGE_BACKEND: local
          STORAGE_PATH: /tmp/storage
          JWT_SECRET: super_secret
        run: |
          cd backend
          pytest tests/ -v

      - name: Verify Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://peblo:peblo_secret_password@localhost:5432/peblotv_test
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: CMS Build & Typecheck
        run: |
          cd cms
          npm ci || npm install
          npm run build
          npm run lint

      - name: Viewer Build & Typecheck
        run: |
          cd viewer
          npm ci || npm install
          npm run build
          npm run lint

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build docker-compose
        run: docker compose build
